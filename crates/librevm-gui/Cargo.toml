[package]
name = "librevm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GTK4 front end for librevm"

[[bin]]
name = "librevm-gui"
path = "src/main.rs"

[dependencies]
librevm-core.workspace = true

anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

# The window runs as whoever opened it, so anything privileged goes over the system
# bus to librevm-daemon. Blocking rather than async: GTK is a callback-shaped,
# single-threaded toolkit and these calls are short.
zbus = { version = "4", default-features = false, features = ["blocking"] }

# GTK 4.18 and libadwaita 1.7 are what the target ships. These crate versions are
# the newest that still build on Rust 1.88; gtk4 0.11 needs 1.92.
gtk4 = { version = "0.9", features = ["v4_16"] }
libadwaita = { version = "0.7", features = ["v1_6"] }
glib = "0.20"
gio = "0.20"
