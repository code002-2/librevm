[workspace]
resolver = "2"
members = [
    "crates/librevm-core",
    "crates/librevm-ctl",
    "crates/librevm-daemon",
    "crates/librevm-gui",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/code002-2/librevm"
description = "A VM manager for Linux, with first-class Gunyah support"

[workspace.dependencies]
librevm-core = { path = "crates/librevm-core" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process", "fs", "socket", "term", "poll"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
