<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Let the librevm group talk to the daemon, and let the daemon itself take the name.

  The daemon manages machines the group is allowed to manage anyway, so it is not a
  privilege boundary in the usual sense: reaching it is equivalent to being in the
  librevm group, which is what /etc/sudoers already granted before this existed. What
  it does buy is that the window no longer has to run as root to get there.

  Anyone else is refused at the bus, before a single method is called.
-->
<busconfig>
  <!--
    Root gets everything, and has to be listed explicitly: the default rule at the
    bottom denies sends, and unlike the session bus the system bus does not exempt
    root from it.
  -->
  <policy user="root">
    <allow own="org.librevm.Daemon1"/>
    <allow send_destination="org.librevm.Daemon1"/>
    <allow receive_sender="org.librevm.Daemon1"/>
  </policy>

  <policy group="librevm">
    <allow own="org.librevm.Daemon1"/>
    <allow send_destination="org.librevm.Daemon1"/>
    <allow receive_sender="org.librevm.Daemon1"/>
  </policy>

  <policy context="default">
    <!-- Everyone may see that the name exists and read its version. -->
    <allow send_destination="org.librevm.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.librevm.Daemon1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <deny send_destination="org.librevm.Daemon1"/>
  </policy>
</busconfig>
